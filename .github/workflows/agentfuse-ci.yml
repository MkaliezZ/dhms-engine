name: AgentFuse CI

on:
  push:
    branches: [agent-harness-v1]
  pull_request:
    branches: [agent-harness-v1]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest==8.3.5
          python -m pip install -e .

      - name: Run full Python tests
        run: python -m pytest

      - name: Compile package
        run: python -m compileall -q dhms_agentfuse
