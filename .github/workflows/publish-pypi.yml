name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (for example, v3.7.3)
        required: true
        default: v3.7.3
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish trusted package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dhms-agentfuse
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release tag like v3.7.3; got: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Verify package version matches tag
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          with pathlib.Path("pyproject.toml").open("rb") as handle:
              actual = tomllib.load(handle)["project"]["version"]
          if actual != expected:
              raise SystemExit(f"tag/package version mismatch: tag={expected}, package={actual}")
          print(f"Publishing dhms-agentfuse {actual} from {os.environ['RELEASE_TAG']}")
          PY

      - name: Build wheel and sdist
        run: python -m build

      - name: Validate distributions
        shell: bash
        run: |
          python -m twine check dist/*
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = "1"
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = "1"
          ls -lh dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
